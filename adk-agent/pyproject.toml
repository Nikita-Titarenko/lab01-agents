[project]
name = "adk-agent"
version = "0.1.0"
description = "Google ADK agent for caching strategies"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=2.31.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
lint = [
    "codespell>=2.4.0",
    "ruff>=0.7.0",
    "ty>=0.0.1a17",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]